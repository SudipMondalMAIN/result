  --violet:#8a2be2;

  --violet-deep:#4c1d95;
  --silver:#eef0f7;
  --silver-dim:#9b96b3;
  --ink:#f4f2fb;
  --ink-dim:#b9b3d1;
  --gold:#e8c35a;
  --green:#7CFFB2;

*{box-sizing:border-box; margin:0; padding:0;}

    linear-gradient(150deg, rgba(138,43,226,0.05) 12%, transparent 12.5%, transparent 87%, rgba(138,43,226,0.05) 87.5%, rgba(138,43,226,0.05)),
    linear-gradient(30deg, rgba(138,43,226,0.05) 12%, transparent 12.5%, transparent 87%, rgba(138,43,226,0.05) 87.5%, rgba(138,43,226,0.05)),
    linear-gradient(150deg, rgba(138,43,226,0.05) 12%, transparent 12.5%, transparent 87%, rgba(138,43,226,0.05) 87.5%, rgba(138,43,226,0.05));
  background-size:56px 98px;
  background-position:0 0, 0 0, 28px 49px, 28px 49px;
  mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 75%);
}

header{
  position:sticky; top:0; z-index:50;
  background:rgba(7,5,13,0.72);
  backdrop-filter: blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
}
nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; max-width:900px; margin:0 auto;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand img{ width:30px; height:30px; object-fit:contain; filter:drop-shadow(0 0 10px rgba(168,85,247,0.6)); }
.brand span{
  font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:0.03em;
  background:linear-gradient(120deg,#fff, var(--violet-2) 65%, var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.brand-sub{ font-size:12px; color:var(--ink-dim); margin-left:2px; }
.navlinks{ display:flex; gap:24px; align-items:center; font-size:13.5px; }
.navlinks a{ color:var(--ink-dim); font-weight:600; transition:color .2s ease; }
.navlinks a:hover{ color:var(--ink); }

.hero{ position:relative; z-index:1; padding:56px 24px 30px; max-width:900px; margin:0 auto; text-align:center; }
.hero .eyebrow{ display:inline-block; margin-bottom:14px; }
.hero h1{ font-size:clamp(28px, 5vw, 42px); color:var(--silver); }
.hero h1 em{
  font-style:normal;
  background:linear-gradient(120deg, var(--violet-2), var(--gold) 70%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{ margin-top:14px; color:var(--ink-dim); font-size:15px; max-width:520px; margin-left:auto; margin-right:auto; }

.live-pill{
  display:inline-flex; align-items:center; gap:8px; margin-top:20px;
  background:rgba(18,11,34,0.85); border:1px solid var(--line);
  border-radius:999px; padding:8px 16px; font-size:12.5px; font-weight:700;
  font-family:var(--display); letter-spacing:0.02em; color:var(--green);
}
.pulse{ width:8px; height:8px; border-radius:50%; background:currentColor; box-shadow:0 0 0 0 currentColor; animation:pulse 1.8s infinite; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(124,255,178,0.5);} 70%{ box-shadow:0 0 0 8px rgba(124,255,178,0);} 100%{ box-shadow:0 0 0 0 rgba(124,255,178,0);} }

.filter-bar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; margin:28px 0 26px; }
.filter-bar input[type="date"]{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  color:var(--ink); padding:9px 12px; font-family:var(--body); font-size:13.5px;
}
.filter-bar input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(0.8); }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--display); font-weight:700; letter-spacing:0.03em; font-size:14px;
  padding:11px 20px; border-radius:10px; cursor:pointer; border:1px solid transparent;
  transition:transform .18s ease, box-shadow .18s ease;
}
.btn:hover{ transform:translateY(-2px); }
.btn-primary{
  background:linear-gradient(135deg,var(--violet-2),var(--violet-deep)); color:#fff;
  box-shadow:0 10px 30px rgba(138,43,226,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn-primary:hover{ box-shadow:0 14px 34px rgba(138,43,226,0.55), inset 0 1px 0 rgba(255,255,255,0.3); }
.btn-ghost{ background:rgba(255,255,255,0.03); border:1px solid var(--line); color:var(--ink); }
.btn-ghost:hover{ background:rgba(255,255,255,0.07); border-color:rgba(200,170,255,0.35); }

.panel{
  background:linear-gradient(160deg, var(--panel), var(--panel-2));
  border:1px solid var(--line); border-radius:var(--radius);
  position:relative; overflow:hidden;
}
.panel::after{
  content:''; position:absolute; top:-40%; right:-40%; width:220px; height:220px;
  background:radial-gradient(circle, rgba(168,85,247,0.18), transparent 70%); pointer-events:none;
}
.section{ position:relative; z-index:1; margin-top:30px; }
.section-title{
  font-family:var(--display); font-size:13px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink-dim); margin-bottom:14px; font-weight:700;
}

.result-card{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:18px 22px; border-bottom:1px solid var(--line); cursor:pointer;
  transition:background .15s ease; position:relative; z-index:1;
}
.result-card:last-child{ border-bottom:none; }
.result-card:hover{ background:rgba(168,85,247,0.06); }
.result-main{ display:flex; flex-direction:column; gap:4px; }
.result-title{ color:var(--silver); font-weight:700; font-family:var(--display); font-size:16px; }
.result-meta{ color:var(--ink-dim); font-size:12.5px; }
.result-prize{ color:var(--gold); font-weight:700; font-family:var(--display); font-size:15px; white-space:nowrap; }

.winner-row{
  display:flex; align-items:center; justify-content:space-between; padding:13px 22px;
  border-bottom:1px solid var(--line); position:relative; z-index:1;
}
.winner-row:last-child{ border-bottom:none; }
.rank-badge{
  width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--display); font-size:13px; font-weight:800; flex-shrink:0;
}
.rank-badge.r1{ background:var(--gold); color:#3a2a05; box-shadow:0 0 14px rgba(232,195,90,0.5); }
.rank-badge.r2{ background:#c7cad6; color:#2c2c2a; }
.rank-badge.r3{ background:#c98a4b; color:#3a1f05; }
.rank-badge.rn{ background:rgba(255,255,255,0.08); color:var(--ink-dim); }
.player-name{ color:var(--silver); font-weight:700; font-size:14.5px; }
.player-uid{ color:var(--ink-dim); font-size:12px; margin-top:2px; }
.winner-amount{ color:var(--green); font-weight:700; font-family:var(--display); font-size:15px; }

.participant-row{
  display:flex; align-items:center; justify-content:space-between; padding:11px 22px;
  border-bottom:1px solid var(--line); font-size:13.5px; position:relative; z-index:1;
}
.participant-row:last-child{ border-bottom:none; }
.participant-row .player-uid{ margin-top:0; }
.kills-tag{ color:var(--ink-dim); font-size:12px; font-family:var(--display); }

.hero-image-frame{
  border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);
  margin:22px 0; box-shadow:0 30px 70px rgba(0,0,0,0.45), 0 0 0 1px rgba(168,85,247,0.15);
}
.hero-image-frame img{ display:block; width:100%; height:auto; }

.empty-state{ padding:44px 22px; text-align:center; color:var(--ink-dim); font-size:13.5px; position:relative; z-index:1; }
.back-link{
  color:var(--ink-dim); font-size:13.5px; display:inline-flex; align-items:center; gap:6px;
  margin-bottom:18px; cursor:pointer; font-family:var(--display); font-weight:600;
}
.back-link:hover{ color:var(--ink); }

footer{ margin:70px 0 40px; text-align:center; color:var(--ink-dim); font-size:12.5px; position:relative; z-index:1; }
footer a:hover{ color:var(--ink); }
</style>
</head>

<main class="wrap" id="app">
  <div class="empty-state">Loading…</div>
</main>

<footer>Official ClassyBattle results · <a href="https://classybattle.online" target="_blank" rel="noopener">classybattle.online</a></footer>

<script>
// ⚠️ CONFIRM THIS BEFORE DEPLOY — see chat notes. Point this at whatever
// domain the backend actually serves from (e.g. your Render URL, or
// api.classybattle.online if that's a working custom domain / proxy).
const API_BASE = "https://api.classybattle.online/api/v1/public/results";

const app = document.getElementById("app");

function fmtDateTime(iso){
  if(!iso) return "—";
  return new Date(iso).toLocaleString(undefined, { dateStyle:"medium", timeStyle:"short" });
}
function fmtMoney(n){
  if(n==null) return "—";
  return `₹${Number(n).toLocaleString()}`;
}
function rankClass(rank){
  return rank===1 ? "r1" : rank===2 ? "r2" : rank===3 ? "r3" : "rn";
}
async function apiGet(path, params){
  const url = new URL(API_BASE + path);
  if(params) Object.entries(params).forEach(([k,v]) => v && url.searchParams.set(k, v));
  const res = await fetch(url, { headers:{ Accept:"application/json" } });
  if(!res.ok) throw new Error(`API failed: ${res.status}`);
  return res.json();
}

function navigateHome(){
  history.pushState({}, "", location.pathname);
  render();
}
function navigateToResult(id){
  const params = new URLSearchParams(location.search);
  params.set("id", id);
  history.pushState({}, "", `${location.pathname}?${params}`);
  render();
}
window.addEventListener("popstate", render);

function resultCard(r){
  return `
    <div class="result-card" onclick="navigateToResult('${r.tournament_id}')">
      <div class="result-main">
        <div class="result-title">${r.title}</div>
        <div class="result-meta">${fmtDateTime(r.starts_at)} · ${r.participant_count} participants</div>
      </div>
      <div class="result-prize">${fmtMoney(r.prize_pool)}</div>
    </div>`;
}

async function renderList(){
  document.title = "ClassyBattle — Tournament Results";
  app.innerHTML = `
    <section class="hero">
      <span class="eyebrow">Esports Tournament Platform</span>
      <h1>Tournament <em>Results</em></h1>
      <p>Winners, participants and prize payouts for every completed ClassyBattle tournament.</p>
      <div class="live-pill"><span class="pulse"></span> Official results</div>
    </section>
    <div class="filter-bar">
      <input type="date" id="date-from" />
      <span style="color:var(--ink-dim);font-size:13px;">to</span>
      <input type="date" id="date-to" />
      <button class="btn btn-ghost" id="filter-btn">Filter</button>
      <button class="btn btn-ghost" id="clear-btn">Clear</button>
    </div>
    <div class="panel" id="results-list"><div class="empty-state">Loading results…</div></div>`;

  document.getElementById("filter-btn").onclick = () =>
    loadResults({
      date_from: document.getElementById("date-from").value,
      date_to: document.getElementById("date-to").value,
    });
  document.getElementById("clear-btn").onclick = () => {
    document.getElementById("date-from").value = "";
    document.getElementById("date-to").value = "";
    loadResults();
  };
  loadResults();
}

async function loadResults(params){
  const el = document.getElementById("results-list");
  el.innerHTML = `<div class="empty-state">Loading results…</div>`;
  try{
    const rows = await apiGet("", params);
    el.innerHTML = rows.length ? rows.map(resultCard).join("") : `<div class="empty-state">No results found for this range.</div>`;
  }catch(e){
    el.innerHTML = `<div class="empty-state">Results are temporarily unavailable. Please try again shortly.</div>`;
  }
}

async function renderDetail(id){
  app.innerHTML = `<div style="padding-top:30px;"><a class="back-link" onclick="navigateHome()">← Back to all results</a><div class="panel"><div class="empty-state">Loading result…</div></div></div>`;
  try{
    const r = await apiGet(`/${id}`);
    document.title = `${r.title} — ClassyBattle Result`;
    const imageUrl = `${API_BASE}/${id}/image`;

    app.innerHTML = `
      <div style="padding-top:30px;">
        <a class="back-link" onclick="navigateHome()">← Back to all results</a>
        <div style="text-align:center;margin-bottom:6px;">
          <span class="eyebrow">Result</span>
          <h1 style="font-size:26px;margin-top:8px;">${r.title}</h1>
          <div style="color:var(--ink-dim);font-size:13.5px;margin-top:6px;">${fmtDateTime(r.starts_at)} · Prize Pool <span style="color:var(--gold);font-weight:700;">${fmtMoney(r.prize_pool)}</span></div>
        </div>
        <div class="hero-image-frame"><img src="${imageUrl}" alt="${r.title} result" loading="lazy" /></div>
        <div style="text-align:center;margin-bottom:26px;">
          <a class="btn btn-primary" href="${imageUrl}" download="${r.tournament_uid}-result.jpg">⬇ Download JPG</a>
        </div>
        <div class="section-title">Winners</div>
        <div class="panel" style="margin-bottom:26px;">
          ${r.winners.map(w => `
            <div class="winner-row">
              <div style="display:flex;align-items:center;gap:12px;">
                <div class="rank-badge ${rankClass(w.rank)}">${w.rank ?? "-"}</div>
                <div>
                  <div class="player-name">${w.name}</div>
                  ${w.game_uid ? `<span class="player-uid">UID ${w.game_uid}</span>` : ""}
                </div>
              </div>
              <div class="winner-amount">${w.winning_amount!=null ? fmtMoney(w.winning_amount) : ""}</div>
            </div>`).join("")}
        </div>
        <div class="section-title">Participants (${r.participants.length})</div>
        <div class="panel">
          ${r.participants.map(p => `
            <div class="participant-row">
              <div><span class="player-name">${p.name}</span> ${p.game_uid ? `<span class="player-uid">· UID ${p.game_uid}</span>` : ""}</div>
              ${p.kills!=null ? `<span class="kills-tag">${p.kills} kills</span>` : ""}
            </div>`).join("")}
        </div>
      </div>`;
  }catch(e){
    app.innerHTML = `<div style="padding-top:30px;"><a class="back-link" onclick="navigateHome()">← Back to all results</a><div class="panel"><div class="empty-state">Result not found or not yet published.</div></div></div>`;
  }
}

function render(){
  const id = new URLSearchParams(location.search).get("id");
  if(id) renderDetail(id);
  else renderList();
}
render();
</script>
